name: Refresh Dallas overdose data

# Two cadences, both keyless. No repository secrets are configured or used.
#
#   daily    scripts/run_all.sh daily -- re-pulls CDC mortality and the naloxone
#            supply feed, then re-derives the local layers built from them.
#   monthly  scripts/run_all.sh monthly -- the daily chain plus the slower-moving
#            open registries and the baseline validation. build_context needs
#            CENSUS_API_KEY and so is skipped here by design; its outputs move on
#            an annual source cadence and are refreshed by hand.
#
# The block-access, placement-ranking, and figure-export stages run only under
# the `full` profile, locally. They pull a statewide TIGER block file and emit
# the manuscript artefacts, which is not work for a scheduled job.
#
# Both jobs commit changes under data/clean/ and data/public/ back to the
# repository, and only when something actually changed. data/public/ holds the
# redacted placement layers the deployed map reads; build_public_data re-derives
# them in every profile so they cannot fall out of step with data/clean/.

on:
  schedule:
    - cron: "17 8 * * *"    # daily, 08:17 UTC (~02-03am US Central)
    - cron: "43 9 1 * *"    # monthly, 1st at 09:43 UTC
  workflow_dispatch:
    inputs:
      mode:
        description: "Which chain to run manually"
        required: false
        default: daily
        type: choice
        options:
          - daily
          - monthly

permissions:
  contents: write

concurrency:
  group: dallas-data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select profile
        id: profile
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${{ github.event.inputs.mode }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "43 9 1 * *" ]; then
            echo "name=monthly" >> "$GITHUB_OUTPUT"
          else
            echo "name=daily" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # geopandas ships manylinux wheels bundling GEOS/GDAL/PROJ via pyogrio,
      # so no apt packages or system libraries are needed.
      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pipeline (${{ steps.profile.outputs.name }})
        run: bash scripts/run_all.sh "${{ steps.profile.outputs.name }}"

      - name: Commit data changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/clean data/public
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "Automated ${{ steps.profile.outputs.name }} data refresh ($(date -u +%Y-%m-%d))"
            git push
          fi
